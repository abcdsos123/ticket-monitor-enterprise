[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-monitor-v19-enterprise"
version = "19.2.0"
description = "Multi-provider Tixcraft and KKTIX monitor with Discord control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "selenium>=4.29.0",
  "nodriver>=0.47.0",
  "discord.py>=2.5.0",
  "python-dotenv>=1.0.1",
  "psutil>=6.1.0",
  "filelock>=3.16.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
